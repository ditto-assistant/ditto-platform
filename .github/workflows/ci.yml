name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  copy-lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: faircopy
        run: npm run lint:copy -- --format github

  lint-and-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    services:
      # The whole suite runs against a real Postgres. SQLite emitted no
      # FOR UPDATE, had no pg_advisory_xact_lock, and had no concurrent
      # writers, so it could not fail on the bug class that reaches
      # production -- see ditto-platform#438.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ditto_test
          POSTGRES_PASSWORD: ditto_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Durability off: this database is rebuilt from migrations on
        # demand, so losing it to a crash costs nothing and the write path
        # gets materially faster.
        options: >-
          --health-cmd "pg_isready -U ditto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_LINUX_X64_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan working tree for secrets
        run: gitleaks dir . --no-banner --redact=100

      - name: Scan reachable Git history for secrets
        run: gitleaks git . --log-opts="--all" --no-banner --redact=100

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy ditto/

      # Object storage for the `integration` tests that exercise the real
      # upload path end to end. Same images and same credentials as the
      # `minio` + `minio-create-bucket` pair in docker-compose.yml, so a
      # developer running `make stack-up` gets the environment CI has.
      # A `run:` step rather than a `services:` entry because the minio
      # server image needs a command argument (`server /data`) and GitHub
      # service containers cannot override CMD.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=miniominio \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            'mc alias set local http://localhost:9000 minio miniominio && \
             mc mb --ignore-existing local/ditto-agents'

      - name: pytest
        env:
          # Admin DSN of the service container above. The harness still
          # creates its own template and per-worker databases from it, so
          # this role must be able to CREATE DATABASE.
          DITTO_TEST_POSTGRES_URI: postgres://ditto_test:ditto_test@localhost:5432/postgres
          # Any provisioning failure is a hard error, never a skip. Without
          # this a broken container turns the entire database suite green --
          # the exact green-on-broken mode this migration exists to delete.
          DITTO_REQUIRE_POSTGRES: "1"
          # The `integration` tests build the real FastAPI app from env via
          # parse_api_server_config_from_env, so the app config has to exist
          # here or they fail at construction. None of these are secrets:
          # the payment address is the well-known //Alice dev key and is
          # never spent (PaymentVerifier is stubbed in those tests), and the
          # MinIO credentials belong to the throwaway container above.
          DITTO_UPLOAD_PAYMENT_ADDRESS: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
          # ChainConfig refuses to construct without credentials, so these are
          # needed to *build* the app even though nothing here reaches Pylon:
          # the only two tests that talk to a chain are `needs_chain`-marked
          # and deselected. The URL points at a port with nothing on it on
          # purpose -- if a test ever starts making real chain calls it will
          # fail loudly here rather than depend on an external network.
          PYLON_URL: http://127.0.0.1:1
          PYLON_OPEN_ACCESS_TOKEN: ci-no-chain
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_ACCESS_KEY: minio
          STORAGE_SECRET_KEY: miniominio
          STORAGE_BUCKET: ditto-agents
          STORAGE_REGION: us-east-1
          STORAGE_USE_TLS: "false"
        run: uv run pytest
